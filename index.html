
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login and Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="logo">MyWebsite</div>

        <div class="tabs">
            <button id="loginTab" class="active">Login</button>
            <button id="registerTab">signup</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <h1>Welcome Back!</h1>
            <p class="subtitle">Login to your account</p>

            <label>Email Address</label>
            <input type="email" id="loginEmail"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <div class="password-box">
                <input type="password" id="loginPassword"
                       placeholder="Enter your password" required>
                <button type="button" class="toggle-password"
                        data-target="loginPassword">Show</button>
            </div>

            <button type="submit" class="main-btn">Login</button>

            <p class="switch-text">
                Don't have an account?
                <a href="#" id="showRegister">Register</a>
            </p>

            <p id="loginMessage" class="message"></p>
        </form>

        <!-- Registration Form -->
        <form id="registerForm" class="hidden">
            <h1>Create Account</h1>
            <p class="subtitle">Register to get started</p>

            <label>Full Name</label>
            <input type="text" id="registerName"
                   placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="registerEmail"
                   placeholder="Enter your email" required>

            <label>Password</label>
            <div class="password-box">
                <input type="password" id="registerPassword"
                       placeholder="Create a password"
                       minlength="6" required>
                <button type="button" class="toggle-password"
                        data-target="registerPassword">Show</button>
            </div>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirm your password" required>

            <button type="submit" class="main-btn">
                Register
            </button>

            <p class="switch-text">
                Already have an account?
                <a href="#" id="showLogin">Login</a>
            </p>

            <p id="registerMessage" class="message"></p>
        </form>

    </div>

    <script src="script.js"></script>
</body>
</html>
